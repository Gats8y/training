<title>像素獵魔者</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
/* Layout: 直式手機遊戲殼 — 上方戰鬥畫面，下方指令面板，單欄最大 480px。刻意只做深色單一主題（遊戲世界觀）。 */
:root{
  --ink:#15131d;
  --panel:#1f1c2b;
  --panel-hi:#2a2640;
  --line:#3a3552;
  --text:#efe8d6;
  --mute:#958eab;
  --gold:#f4c24f;
  --gem:#62d6ea;
  --hp:#e2485c;
  --mp:#4b8ff0;
  --exp:#8ee068;
  --ember:#ff8a3d;
  --r0:#a8a4b8; --r1:#6fd08c; --r2:#5aa9f5; --r3:#b77cf2; --r4:#f5b041; --r5:#ff5e6c;
  --f-pixel:"DotGothic16", ui-monospace, "Courier New", monospace;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ink);color:var(--text)}
body{font-family:var(--f-body);font-size:14px;line-height:1.5;padding:0 16px;padding-block:12px 32px;-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.num,.px{font-family:var(--f-pixel);font-variant-numeric:tabular-nums;letter-spacing:.5px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* 頂部資源列 */
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stage-name{flex:1;min-width:0}
.stage-name .w{font-size:12px;color:var(--mute)}
.stage-name .s{font-family:var(--f-pixel);font-size:18px;line-height:1.1}
.res{display:flex;align-items:center;gap:6px;background:var(--panel);border:2px solid var(--line);padding:3px 8px;font-family:var(--f-pixel);font-size:14px}
.ico{width:10px;height:10px;display:inline-block;flex-shrink:0}
.ico.gold{background:var(--gold);box-shadow:inset -2px -2px 0 #b8841c,inset 2px 2px 0 #fff2b0}
.ico.gem{background:var(--gem);transform:rotate(45deg) scale(.8);box-shadow:inset -2px -2px 0 #2a8aa8,inset 2px 2px 0 #d8fbff}

/* 戰鬥畫面 */
.stage{position:relative;border:2px solid var(--line);background:#000;box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--panel-hi)}
#cv{display:block;width:100%;max-width:100%;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges}
.hud{position:absolute;left:6px;right:6px;top:6px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.hud .row{display:flex;align-items:center;gap:6px}
.hud .lbl{font-family:var(--f-pixel);font-size:11px;text-shadow:1px 1px 0 #000;white-space:nowrap}
.bar{position:relative;height:8px;flex:1;background:#0c0a12;border:1px solid #000;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.bar>i{position:absolute;left:0;top:0;bottom:0;display:block;transition:width .12s linear}
.bar.prog>i{background:var(--gold)}
.bar.boss{height:10px}
.bar.boss>i{background:var(--hp)}
.timer{font-family:var(--f-pixel);font-size:12px;color:var(--gold);text-shadow:1px 1px 0 #000;min-width:34px;text-align:right}
.boss-btn{pointer-events:auto;align-self:flex-end;background:var(--hp);border:2px solid #000;box-shadow:inset -2px -2px 0 #8a1f2e,inset 2px 2px 0 #ff9aa6;padding:3px 10px;font-weight:900;font-size:12px;color:#fff;text-shadow:1px 1px 0 #6a0f1c;animation:pulse 1s steps(2) infinite}
@keyframes pulse{50%{filter:brightness(1.25)}}
.speed{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.3);padding:1px 7px;font-family:var(--f-pixel);font-size:12px}

/* 角色狀態 + 技能列 */
.status{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;background:var(--panel);border:2px solid var(--line);padding:8px 10px}
.status .lv{font-family:var(--f-pixel);font-size:16px;grid-row:span 3;align-self:center;text-align:center;min-width:44px;line-height:1.1}
.status .lv small{display:block;font-size:10px;color:var(--mute)}
.sbar{display:flex;align-items:center;gap:6px;min-width:0}
.sbar .bar{height:9px}
.sbar .t{font-family:var(--f-pixel);font-size:10px;color:var(--mute);min-width:84px;text-align:right;white-space:nowrap}
.bar.hp>i{background:var(--hp)} .bar.mp>i{background:var(--mp)} .bar.xp>i{background:var(--exp)}

.skills{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:6px}
.slot{position:relative;aspect-ratio:1;max-width:100%;border:2px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:0}
.slot .el{font-weight:900;font-size:20px;line-height:1}
.slot .nm{font-size:10px;color:var(--mute);margin-top:2px}
.slot .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(10,8,16,.72);pointer-events:none}
.slot .lvl{position:absolute;right:2px;top:0;font-family:var(--f-pixel);font-size:10px;color:var(--mute)}
.slot.locked{opacity:.35}
.slot.ready{box-shadow:inset 0 0 0 1px currentColor}
.auto{border:2px solid var(--line);background:var(--panel);padding:0 8px;font-size:11px;font-weight:700;line-height:1.2;writing-mode:horizontal-tb}
.auto.on{border-color:var(--exp);color:var(--exp)}

/* 分頁 */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border:2px solid var(--line);background:var(--panel)}
.tabs button{background:none;border:0;border-right:2px solid var(--line);padding:8px 0;font-weight:700;font-size:13px;color:var(--mute)}
.tabs button:last-child{border-right:0}
.tabs button[aria-selected="true"]{background:var(--panel-hi);color:var(--text);box-shadow:inset 0 -3px 0 var(--gold)}
.panel{background:var(--panel);border:2px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:260px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.seg{display:flex;border:2px solid var(--line)}
.seg button{background:none;border:0;padding:2px 10px;font-family:var(--f-pixel);font-size:12px;color:var(--mute)}
.seg button.on{background:var(--panel-hi);color:var(--text)}

.row-item{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:var(--ink);border:2px solid var(--line);padding:6px 8px}
.badge{width:34px;height:34px;display:grid;place-items:center;font-weight:900;font-size:15px;border:2px solid #000;box-shadow:inset -3px -3px 0 rgba(0,0,0,.35),inset 3px 3px 0 rgba(255,255,255,.25);color:#15131d}
.row-item .info{min-width:0}
.row-item .t1{font-weight:700;font-size:14px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.row-item .t1 .num{font-size:11px;color:var(--mute);font-weight:400}
.row-item .t2{font-size:12px;color:var(--mute)}
.row-item .t2 b{color:var(--exp);font-weight:700}
.buy{min-width:86px;background:var(--panel-hi);border:2px solid #000;box-shadow:inset -2px -2px 0 rgba(0,0,0,.4),inset 2px 2px 0 rgba(255,255,255,.12);padding:5px 8px;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.buy .c{display:flex;align-items:center;gap:4px;font-family:var(--f-pixel);font-size:12px;color:var(--gold)}
.buy .k{font-size:11px;font-weight:700}
.buy:disabled{opacity:.4;cursor:default}
.buy:not(:disabled):active{transform:translateY(1px)}
.buy.gem .c{color:var(--gem)}

.grid-w{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.wcell{position:relative;border:2px solid var(--line);background:var(--ink);padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.wcell canvas{width:36px;height:36px;image-rendering:pixelated}
.wcell .n{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.wcell .l{font-family:var(--f-pixel);font-size:10px;color:var(--mute)}
.wcell.off{opacity:.3;cursor:default}
.wcell.eq::after{content:"裝備中";position:absolute;top:-2px;left:-2px;background:var(--gold);color:#15131d;font-size:9px;font-weight:900;padding:0 3px}
.sum-box{display:flex;flex-direction:column;gap:6px;background:var(--ink);border:2px solid var(--line);padding:8px 10px}
.sum-box .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sum-box .hd b{font-size:15px}
.sum-box .btns{display:flex;gap:6px}
.rates{display:flex;flex-wrap:wrap;gap:4px 10px;font-family:var(--f-pixel);font-size:10px}
.result{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;min-height:0}
.result .it{border:2px solid;background:var(--panel);font-size:10px;text-align:center;padding:3px 1px;animation:pop .25s steps(3) both;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.note{font-size:12px;color:var(--mute)}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13px}
.kv .num{text-align:right}

.modal{position:fixed;inset:0;background:rgba(8,6,12,.78);display:grid;place-items:center;padding:16px;z-index:10}
.modal .box{background:var(--panel);border:2px solid var(--gold);box-shadow:0 0 0 4px var(--ink),0 0 0 6px var(--line);padding:16px 18px;max-width:320px;width:100%;display:flex;flex-direction:column;gap:10px;text-align:center}
.modal h3{margin:0;font-size:17px}
.modal .buy{align-self:center;min-width:120px;padding:8px}
@media (prefers-reduced-motion:reduce){.boss-btn,.result .it{animation:none}}
</style>

<div class="app">

    <button role="tab" data-tab="summon" aria-selected="false">召喚</button>
  </nav>
  <section class="panel" id="panel"></section>
</div>
<div class="modal" id="modal" hidden><div class="box" id="modalBox"></div></div>

<script>
(() => {

// ============================================================ 常數與資料
const VW = 192, VH = 108, SC = 4, GROUND = 88, HERO_X = 50;

const UNITS = ['','K','M','B','T','aa','ab','ac','ad','ae','af','ag'];
function fmt(n){
  if (!isFinite(n)) return '∞';
  if (n < 1000) return String(Math.floor(n));
  let i = 0; while (n >= 1000 && i < UNITS.length-1){ n /= 1000; i++; }
  return (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : Math.floor(n)) + UNITS[i];
}

  rows.forEach((r, j) => [...r].forEach((ch, i) => {
    if (ch === '.' || !pal[ch]) return;
    x.fillStyle = white ? '#ffffff' : pal[ch]; x.fillRect(i, j, 1, 1);

  return c;
}

    '....kGGk.kGGk...',
    '...kkkk..kkkk...'], fly:false },
};
const MON_KINDS = ['slime','bat','goblin'];

const SPR = { hero:{}, sword:null, mon:{} };
function buildSprites(){
  SPR.hero.a = sprite(HERO_TOP.concat(HERO_LEG_A), HERO_PAL);
  SPR.hero.b = sprite(HERO_TOP.concat(HERO_LEG_B), HERO_PAL);
  SPR.hero.w = sprite(HERO_TOP.concat(HERO_LEG_A), HERO_PAL, true);
  SPR.sword = sprite(SWORD_ROWS, { w:'#e6edf5', g:'#d9a13b', b:'#6b4a2a' });
  WORLDS.forEach((wd, wi) => {

      if (k === 'boss') Object.assign(pal, { R:'#2a2238' });
      SPR.mon[wi][k] = { n: sprite(MON[k].rows, pal), w: sprite(MON[k].rows, pal, true) };
    }

}
function weaponIcon(i, size){
  // 以稀有度著色的小劍圖示
  const col = RARITY[WEAPONS[i].r].color;
  const rows = [
    '.......kk',

// ============================================================ 狀態
function freshState(){
  return { v:1, stage:1, best:1, kills:0, totalKills:0, gold:0, dia:300, lv:1, exp:0, sp:0,
    up:{ atk:0, hp:0, regen:0, crit:0, cdmg:0 }, st:{ str:0, vit:0, agi:0, luk:0 },
    sk:{}, wp:{ 0:1 }, eq:0, autoSkill:true, autoBoss:true, speed:1, last:Date.now() };
}
let S = freshState();
function load(data){
  let src = data && data.S;
  if (!src){ const raw = store.get('pixel-slayer-v1'); if (raw) try { src = JSON.parse(raw); } catch(e){} }
  if (src && src.v === 1){
    const f = freshState();
    S = { ...f, ...src, up:{ ...f.up, ...src.up }, st:{ ...f.st, ...src.st }, sk:{ ...src.sk }, wp:{ ...f.wp, ...src.wp } };
    return true;
  }
  return false;
}
function save(){ S.last = Date.now(); store.set('pixel-slayer-v1', JSON.stringify(S)); }

// 衍生數值
const D = {};
function derive(){
  const w = WEAPONS[S.eq];
  let owned = 0; for (const id in S.wp) owned += WEAPONS[id].own * S.wp[id];
  const eqMul = w.mul * (1 + 0.15 * (S.wp[S.eq] - 1));
  D.eqMul = eqMul; D.owned = owned;
  D.atk = UPG[0].val(S.up.atk) * (1 + 0.02*S.st.str) * (1 + 0.03*(S.lv-1)) * eqMul * (1 + owned);
  D.maxHp = UPG[1].val(S.up.hp) * (1 + 0.03*S.st.vit) * (1 + 0.03*(S.lv-1));
  D.regen = UPG[2].val(S.up.regen) / 100;
  D.crit = Math.min(1, (UPG[3].val(S.up.crit) + 0.1*S.st.luk) / 100);
  D.cdmg = UPG[4].val(S.up.cdmg) / 100;
  D.aspd = 1.25 * (1 + 0.01*S.st.agi);
  D.goldMul = 1 + 0.02*S.st.luk;
  D.maxMp = 100; D.mpRegen = 6;
}
function upgCost(u, L){ return Math.floor(u.base * Math.pow(u.g, L)); }
function monHp(s){ return 14 * Math.pow(1.15, s-1); }
function monAtk(s){ return 4 * Math.pow(1.11, s-1); }
function monGold(s){ return 3 * Math.pow(1.14, s-1); }
function monExp(s){ return 3 * Math.pow(1.12, s-1); }
function expNeed(lv){ return Math.floor(12 * Math.pow(1.16, lv-1)); }
const worldIdx = s => Math.floor((s-1)/10) % WORLDS.length;

// ============================================================ 戰鬥世界
const G = {
  scroll:0, running:true, mode:'farm', bossT:0, spawnT:0.3,
  hero:{ hp:100, mp:100, atkT:0, swing:0, flash:0, dead:0, frameT:0, frame:0 },
  enemies:[], parts:[], texts:[], banner:null, shake:0, cds:{}, flashScreen:0,
};
const terrain = (() => {
  const N = 480, r = rng(7);
  const mk = (base, amps) => { const ph = amps.map(() => r()*Math.PI*2); const a = new Float32Array(N);
    for (let i=0;i<N;i++){ let h = base; amps.forEach(([k,amp],j) => h += amp*Math.sin(2*Math.PI*k*i/N + ph[j])); a[i] = Math.round(h); } return a; };
  const trees = []; for (let x=0; x<N; x += 10 + Math.floor(r()*18)) trees.push({ x, h: 10 + Math.floor(r()*10) });
  const specks = []; for (let i=0;i<60;i++) specks.push({ x:Math.floor(r()*N), y:GROUND+4+Math.floor(r()*(VH-GROUND-6)), w:1+Math.floor(r()*3) });
  return { N, far: mk(26, [[2,7],[5,4],[11,3],[23,1.5]]), mid: mk(13, [[3,3],[7,3],[17,2]]), trees, specks };
})();

function spawnEnemy(boss){
  const s = S.stage, wi = worldIdx(s);
  const kind = boss ? 'boss' : MON_KINDS[Math.floor(Math.random()*MON_KINDS.length)];
  const hp = monHp(s) * (boss ? 12 : 1) * (kind === 'goblin' ? 1.3 : kind === 'bat' ? 0.8 : 1);
  G.enemies.push({ kind, boss, wi, x: VW + 14, hp, max:hp, atk: monAtk(s) * (boss ? 2.2 : 1),
    atkT: 0.6, flash:0, dead:0, bob: Math.random()*6, scale: boss ? 2 : 1 });
}
function frontEnemy(){ let f = null; for (const e of G.enemies) if (!e.dead && (!f || e.x < f.x)) f = e; return f; }
const MELEE = 20;

function startBoss(){
  G.enemies.forEach(e => { if (!e.dead){ e.dead = 0.001; poof(e.x, GROUND-6, '#ffffff', 6); } });
  G.mode = 'boss'; G.bossT = BOSS_TIME; spawnEnemy(true);
  G.banner = { text:'魔王出現！', t:1.4, color:'#ff5e6c' };
}
function endBoss(win){
  G.mode = 'farm';
  if (win){
    const first = S.stage >= S.best;
    const g = monGold(S.stage) * 10 * D.goldMul; S.gold += g;
    addText(HERO_X + 30, GROUND - 40, '+' + fmt(g), '#f4c24f', 9);
    if (first){ S.dia += 20; addText(HERO_X + 30, GROUND - 52, '+20 鑽石', '#62d6ea', 8); }
    S.stage++; S.best = Math.max(S.best, S.stage); S.kills = 0;
    G.banner = { text:`STAGE ${S.stage}`, t:1.6, color:'#f4c24f' };
    if ((S.stage-1) % 10 === 0) G.banner.text = WORLDS[worldIdx(S.stage)].name;
  } else {
    S.autoBoss = false;
    G.enemies.forEach(e => { if (!e.dead) e.dead = 0.001; });
    G.banner = { text:'挑戰失敗', t:1.4, color:'#958eab' };
  }
  refreshAll();
}

function heroDamage(mult){
  const crit = Math.random() < D.crit;
  return { v: D.atk * mult * (crit ? D.cdmg : 1) * (0.9 + Math.random()*0.2), crit };
}
function hitEnemy(e, dmg, crit, color){
  if (e.dead) return;
  e.hp -= dmg; e.flash = 0.08;
  addText(e.x + (Math.random()*8-4), GROUND - 14*e.scale - 6, fmt(dmg), crit ? '#ffd23f' : (color || '#ffffff'), crit ? 10 : 7);
  if (e.hp <= 0) killEnemy(e);
}
function killEnemy(e){
  e.dead = 0.001; e.hp = 0;
  poof(e.x, GROUND - 6*e.scale, WORLDS[e.wi].mon.g, e.boss ? 30 : 10);
  if (e.boss){ G.shake = 0.4; endBoss(true); return; }
  const g = monGold(S.stage) * D.goldMul; S.gold += g;
  for (let i=0;i<3;i++) G.parts.push({ x:e.x, y:GROUND-8, vx:(Math.random()-0.3)*40, vy:-50-Math.random()*30, g:160, life:0.7, c:'#f4c24f', s:2 });
  gainExp(monExp(S.stage));
  S.totalKills++;
  if (S.totalKills % 50 === 0){ S.dia += 5; addText(HERO_X, GROUND - 44, '+5 鑽石', '#62d6ea', 8); }
  if (G.mode === 'farm'){
    S.kills = Math.min(KILLS_PER_STAGE, S.kills + 1);
  }
}
function gainExp(x){
  S.exp += x;
  let up = false;
  while (S.exp >= expNeed(S.lv)){ S.exp -= expNeed(S.lv); S.lv++; S.sp += 3; S.dia += 2; up = true; }
  if (up){ derive(); G.hero.hp = D.maxHp; G.banner = { text:`LEVEL UP  Lv.${S.lv}`, t:1.2, color:'#8ee068' }; refreshAll(); }
}
function poof(x, y, c, n){
  for (let i=0;i<n;i++){ const a = Math.random()*Math.PI*2, sp = 20 + Math.random()*50;
    G.parts.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 20, g:80, life:0.4 + Math.random()*0.3, c, s: 1 + (Math.random()*2|0) }); }
}
function addText(x, y, t, c, size){ G.texts.push({ x, y, t, c, size, life:0.9 }); }

// ============================================================ 技能
function castSkill(sk){
  const lv = S.sk[sk.id];
  const h = G.hero;
  G.cds[sk.id] = sk.cd; h.mp -= sk.mp;
  const f = frontEnemy();
  if (sk.id === 'fire' && f){
    const d = heroDamage(sk.pct(lv)/100); hitEnemy(f, d.v, d.crit, '#ff9a5a');
    for (let i=0;i<18;i++) G.parts.push({ x:f.x, y:GROUND-8*f.scale, vx:(Math.random()-0.5)*90, vy:-Math.random()*90, g:120, life:0.5, c: i%2 ? '#ff7a3a' : '#ffd23f', s:2 });
  } else if (sk.id === 'water'){
    const amt = D.maxHp * sk.pct(lv)/100; h.hp = Math.min(D.maxHp, h.hp + amt);
    addText(HERO_X, GROUND - 26, '+' + fmt(amt), '#6ee8a0', 8);
    for (let i=0;i<16;i++) G.parts.push({ x:HERO_X - 8 + Math.random()*16, y:GROUND - Math.random()*6, vx:0, vy:-30-Math.random()*30, g:0, life:0.7, c:'#4ac0ff', s:1 });
  } else if (sk.id === 'wind' && f){
    for (let i=0;i<5;i++) setTimeout(() => { if (!f.dead){ const d = heroDamage(sk.pct(lv)/100); hitEnemy(f, d.v, d.crit, '#b8ffd0');
      G.parts.push({ slash:true, x:f.x, y:GROUND-8*f.scale, a:Math.random()*Math.PI, life:0.18, c:'#c9ffe0' }); } }, i * 90 / S.speed);
  } else if (sk.id === 'earth'){
    G.shake = 0.3;
    G.enemies.forEach(e => { if (!e.dead){ const d = heroDamage(sk.pct(lv)/100); hitEnemy(e, d.v, d.crit, '#ffd08a'); } });
    for (let x=HERO_X; x<VW; x+=6) G.parts.push({ x, y:GROUND, vx:(Math.random()-0.5)*20, vy:-40-Math.random()*60, g:200, life:0.6, c: x%12 ? '#a8733a' : '#6d4b2c', s:2 });
  }
}
function trySkills(){
  if (!S.autoSkill || G.hero.dead) return;
  const f = frontEnemy(), engaged = f && f.x - HERO_X <= MELEE + 30;
  for (const sk of SKILLS){
    if (!S.sk[sk.id] || (G.cds[sk.id] || 0) > 0 || G.hero.mp < sk.mp) continue;
    if (sk.id === 'water' ? G.hero.hp / D.maxHp < 0.6 : engaged){ castSkill(sk); break; }
  }
}

// ============================================================ 主迴圈
function update(dt){
  const h = G.hero;
  G.shake = Math.max(0, G.shake - dt);
  if (G.banner && (G.banner.t -= dt) <= 0) G.banner = null;
  for (const k in G.cds) G.cds[k] = Math.max(0, G.cds[k] - dt);

  // 英雄死亡與復活
  if (h.dead > 0){
    h.dead -= dt;
    if (h.dead <= 0){ h.hp = D.maxHp; h.mp = D.maxMp; }
  } else {
    h.hp = Math.min(D.maxHp, h.hp + D.maxHp * D.regen * dt);
    h.mp = Math.min(D.maxMp, h.mp + D.mpRegen * dt);
  }

  // 生怪 / 魔王
  if (G.mode === 'farm'){
    if (S.kills >= KILLS_PER_STAGE && S.autoBoss && !h.dead) startBoss();
    else {
      G.spawnT -= dt;
      const alive = G.enemies.filter(e => !e.dead).length;
      if (G.spawnT <= 0 && alive < 3){ spawnEnemy(false); G.spawnT = 1.1 + Math.random()*0.6; }
    }
  } else {
    G.bossT -= dt;
    if (G.bossT <= 0) endBoss(false);
  }

  // 移動：前方沒有敵人就往前跑（背景捲動）
  const f = frontEnemy();
  G.running = !h.dead && (!f || f.x - HERO_X > MELEE);
  const scrollV = G.running ? 38 : 0;
  G.scroll += scrollV * dt;
  const alive = G.enemies.filter(e => !e.dead).sort((a,b) => a.x - b.x);
  alive.forEach((e, i) => {
    const stopX = HERO_X + MELEE - 4 + i * 16 + (e.boss ? 10 : 0);
    e.x = Math.max(stopX, e.x - (scrollV + 14) * dt);
    e.flash = Math.max(0, e.flash - dt);
    // 敵人攻擊
    if (i === 0 && !h.dead && e.x - HERO_X <= MELEE + 12){
      e.atkT -= dt;
      if (e.atkT <= 0){
        e.atkT = e.boss ? 1.1 : 1.4; e.lunge = 0.15;
        h.hp -= e.atk; h.flash = 0.1;
        addText(HERO_X - 4, GROUND - 22, '-' + fmt(e.atk), '#ff6b7d', 7);
        if (h.hp <= 0){ h.hp = 0; h.dead = 2; poof(HERO_X, GROUND-8, '#c23b4e', 14);
          if (G.mode === 'boss') endBoss(false);
          else G.enemies.forEach(en => { if (!en.dead) en.dead = 0.001; });
        }
      }
    }
    e.lunge = Math.max(0, (e.lunge || 0) - dt);
  });
  G.enemies.forEach(e => { if (e.dead) e.dead += dt; });
  G.enemies = G.enemies.filter(e => !e.dead || e.dead < 0.35);

  // 英雄普攻
  h.flash = Math.max(0, h.flash - dt);
  h.swing = Math.max(0, h.swing - dt);
  if (!h.dead && f && f.x - HERO_X <= MELEE + 12){
    h.atkT -= dt;
    if (h.atkT <= 0){ h.atkT = 1 / D.aspd; h.swing = 0.18; const d = heroDamage(1); hitEnemy(f, d.v, d.crit); }
  } else h.atkT = Math.min(h.atkT, 0.15);
  trySkills();

  h.frameT += dt; if (h.frameT > 0.13){ h.frameT = 0; h.frame ^= 1; }

  // 粒子與文字
  G.parts.forEach(p => { p.life -= dt; if (!p.slash){ p.vy += (p.g||0) * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.g && p.y > GROUND+2 && p.vy > 0){ p.y = GROUND+2; p.vy *= -0.3; p.vx *= 0.6; } } });
  G.parts = G.parts.filter(p => p.life > 0);
  G.texts.forEach(t => { t.life -= dt; t.y -= 22 * dt; });
  G.texts = G.texts.filter(t => t.life > 0);
}

// ============================================================ 繪圖
const cv = $('cv'); cv.width = VW*SC; cv.height = VH*SC;
const ctx = cv.getContext('2d');
function drawLayer(arr, off, color, baseY){
  ctx.fillStyle = color; const N = terrain.N;
  for (let x=0; x<VW; x++){ const i = ((Math.floor(x + off) % N) + N) % N; const hh = arr[i]; ctx.fillRect(x, baseY - hh, 1, hh); }
}
function drawTree(type, x, h, col){
  ctx.fillStyle = col;
  if (type === 'round'){ ctx.fillRect(x-1, GROUND-h+5, 2, h-5); ctx.fillRect(x-5, GROUND-h, 10, 6); ctx.fillRect(x-4, GROUND-h-2, 8, 2); ctx.fillRect(x-6, GROUND-h+2, 12, 3); }
  else if (type === 'pine'){ ctx.fillRect(x-1, GROUND-4, 2, 4); for (let i=0;i<4;i++) ctx.fillRect(x-1-i*1.5, GROUND-h+i*3, 2+i*3, 3); ctx.fillRect(x-6, GROUND-h+12, 12, 3); }
  else if (type === 'cactus'){ ctx.fillRect(x-1, GROUND-h+2, 3, h-2); ctx.fillRect(x-5, GROUND-h+6, 2, 5); ctx.fillRect(x-5, GROUND-h+10, 5, 2); ctx.fillRect(x+3, GROUND-h+4, 2, 4); ctx.fillRect(x+1, GROUND-h+7, 4, 2); }
  else if (type === 'spike'){ for (let i=0;i<h;i+=2) ctx.fillRect(x - Math.floor((h-i)/5), GROUND-h+i, 1 + Math.floor((i)/3), 2); }
  else { ctx.fillRect(x-1, GROUND-h, 3, h); ctx.fillRect(x-3, GROUND-h+4, 7, h-4); ctx.fillRect(x+4, GROUND-h/2, 2, h/2); }
}
function draw(){
  const wi = worldIdx(S.stage), wd = WORLDS[wi];
  ctx.setTransform(SC, 0, 0, SC, 0, 0); ctx.imageSmoothingEnabled = false;
  if (G.shake > 0) ctx.translate(Math.round((Math.random()-0.5)*3), Math.round((Math.random()-0.5)*2));
  // 天空（分段色帶，保持像素感）
  for (let i=0;i<8;i++){ const t = i/7; ctx.fillStyle = mix(wd.sky[0], wd.sky[1], t); ctx.fillRect(-4, i*9, VW+8, 10); }
  ctx.fillStyle = mix(wd.sky[1], wd.far, 0.3); ctx.fillRect(-4, 72, VW+8, GROUND-72);
  drawLayer(terrain.far, G.scroll*0.15, wd.far, GROUND - 14);
  ctx.fillStyle = wd.far; ctx.fillRect(-4, GROUND-14, VW+8, 14);
  drawLayer(terrain.mid, G.scroll*0.4, wd.mid, GROUND);
  // 樹（0.6 視差）
  const N = terrain.N, toff = G.scroll*0.6;
  for (const t of terrain.trees){ let x = ((t.x - toff) % N + N) % N; if (x > VW + 10) x -= N; if (x < -10) continue; drawTree(wd.tree, Math.round(x), t.h, shade(wd.mid, -0.25)); }
  // 地面
  ctx.fillStyle = wd.ground; ctx.fillRect(-4, GROUND, VW+8, VH-GROUND+4);
  ctx.fillStyle = wd.edge; ctx.fillRect(-4, GROUND, VW+8, 2);
  ctx.fillStyle = wd.dirt;
  for (const s of terrain.specks){ let x = ((s.x - G.scroll) % N + N) % N; if (x < VW) ctx.fillRect(Math.round(x), s.y, s.w, 1); }

  // 敵人
  for (const e of G.enemies){
    const spr = SPR.mon[e.wi][e.kind], img = e.flash > 0 ? spr.w : spr.n, sc = e.scale;
    const w = img.width*sc, hgt = img.height*sc;
    let y = GROUND - hgt;
    if (MON[e.kind].fly) y = GROUND - hgt - 14 + Math.sin(performance.now()/180 + e.bob)*3;
    else if (e.kind === 'slime') y += Math.round(Math.abs(Math.sin(performance.now()/160 + e.bob)));
    const lx = e.lunge > 0 ? -3 : 0;
    ctx.globalAlpha = e.dead ? Math.max(0, 1 - e.dead/0.35) : 1;
    ctx.drawImage(img, Math.round(e.x - w/2 + lx), Math.round(y), w, hgt);
    ctx.globalAlpha = 1;
    if (!e.dead && !e.boss){ // 小血條
      const bw = 14; ctx.fillStyle = '#000'; ctx.fillRect(Math.round(e.x - bw/2)-1, Math.round(y) - 5, bw+2, 3);
      ctx.fillStyle = '#e2485c'; ctx.fillRect(Math.round(e.x - bw/2), Math.round(y) - 4, Math.max(0, Math.round(bw * e.hp / e.max)), 1);
    }
  }

  // 英雄
  const h = G.hero;
  if (!(h.dead > 0)){
    const img = h.flash > 0 ? SPR.hero.w : (G.running ? (h.frame ? SPR.hero.b : SPR.hero.a) : SPR.hero.a);
    const bob = G.running && h.frame ? -1 : 0;
    const hx = HERO_X - 6 + (h.swing > 0 ? 2 : 0), hy = GROUND - img.height + bob;
    // 劍（在身體後方先畫一半的揮舞）
    const p = h.swing > 0 ? 1 - h.swing/0.18 : 0;
    const ang = h.swing > 0 ? -1.2 + p*2.9 : 0.55 + (G.running ? (h.frame ? 0.1 : -0.05) : 0);
    ctx.drawImage(img, hx, hy);
    ctx.save(); ctx.translate(hx + 10, hy + 9); ctx.rotate(ang); ctx.drawImage(SPR.sword, -1, -9); ctx.restore();
    if (h.swing > 0.06){ ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(hx + 10, hy + 9, 11, -1.2, -1.2 + p*2.9); ctx.stroke(); }
  }

  // 粒子
  for (const p of G.parts){
    if (p.slash){ ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.globalAlpha = p.life/0.18; ctx.fillRect(-12, 0, 24, 1); ctx.restore(); ctx.globalAlpha = 1; continue; }
    ctx.globalAlpha = clamp(p.life*2, 0, 1); ctx.fillStyle = p.c; ctx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s);
  }
  ctx.globalAlpha = 1;

  // 浮動文字（用較高解析度畫，數字才清楚）
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of G.texts){
    ctx.globalAlpha = clamp(t.life*2, 0, 1);
    ctx.font = `${t.size*SC}px ${PX_FONT}`;
    ctx.lineWidth = SC*1.5; ctx.strokeStyle = '#120e18'; ctx.strokeText(t.t, t.x*SC, t.y*SC);
    ctx.fillStyle = t.c; ctx.fillText(t.t, t.x*SC, t.y*SC);
  }
  ctx.globalAlpha = 1;
  if (h.dead > 0){ ctx.fillStyle = 'rgba(10,6,16,.45)'; ctx.fillRect(0, 0, cv.width, cv.height); drawBanner('復活中…', '#efe8d6', 1); }
  else if (G.banner) drawBanner(G.banner.text, G.banner.color, clamp(G.banner.t*2, 0, 1));
}
function drawBanner(text, color, a){
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(12,8,20,.7)'; ctx.fillRect(0, cv.height*0.36, cv.width, cv.height*0.2);
  ctx.font = `${16*SC}px ${PX_FONT}`; ctx.lineWidth = SC*2; ctx.strokeStyle = '#000';
  ctx.strokeText(text, cv.width/2, cv.height*0.46); ctx.fillStyle = color; ctx.fillText(text, cv.width/2, cv.height*0.46);
  ctx.globalAlpha = 1;
}
function hex(c){ const n = parseInt(c.slice(1), 16); return [n>>16 & 255, n>>8 & 255, n & 255]; }
function mix(a, b, t){ const A = hex(a), B = hex(b); return `rgb(${A.map((v,i) => Math.round(v + (B[i]-v)*t)).join(',')})`; }
function shade(c, t){ return t < 0 ? mix(c, '#000000', -t) : mix(c, '#ffffff', t); }

// ============================================================ 介面
let tab = 'up', buyN = 1, lastSummon = { kind:null, items:[] };
const skillBar = $('skillBar');
function buildSkillBar(){
  skillBar.innerHTML = SKILLS.map(sk => `
    <button class="slot" data-sk="${sk.id}" style="color:${sk.color}" aria-label="${sk.name}">
      <span class="el">${sk.el}</span><span class="nm">${sk.name}</span><span class="lvl"></span><span class="cd"></span>
    </button>`).join('') + `<button class="auto" id="autoBtn">自動<br>技能</button>`;
}
function updateSkillBar(){
  skillBar.querySelectorAll('.slot').forEach(b => {
    const sk = SKILLS.find(s => s.id === b.dataset.sk), lv = S.sk[sk.id];
    b.classList.toggle('locked', !lv);
    b.querySelector('.lvl').textContent = lv ? 'Lv' + lv : '';
    const cd = G.cds[sk.id] || 0;
    const ready = lv && cd <= 0 && G.hero.mp >= sk.mp;
    b.classList.toggle('ready', !!ready);
    b.querySelector('.cd').style.height = lv ? (cd > 0 ? (cd / sk.cd * 100) : (G.hero.mp < sk.mp ? 100 : 0)) + '%' : '100%';
  });
  const a = $('autoBtn'); a.classList.toggle('on', S.autoSkill);
}
skillBar.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'autoBtn'){ S.autoSkill = !S.autoSkill; updateSkillBar(); return; }
  const sk = SKILLS.find(s => s.id === b.dataset.sk);
  if (sk && S.sk[sk.id] && !(G.cds[sk.id] > 0) && G.hero.mp >= sk.mp && !G.hero.dead) castSkill(sk);
});

$('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  tab = b.dataset.tab;
  $('tabs').querySelectorAll('button').forEach(x => x.setAttribute('aria-selected', x === b));
  renderPanel();
});
$('speedBtn').addEventListener('click', () => { S.speed = S.speed === 1 ? 2 : S.speed === 2 ? 4 : 1; $('speedBtn').textContent = 'x' + S.speed; });
$('bossBtn').addEventListener('click', () => { S.autoBoss = true; });

function buyCount(u, L, gold){
  // 回傳本次可買的等級數與總價
  let n = 0, cost = 0; const cap = u.max != null ? u.max - L : Infinity;
  const want = buyN === 'max' ? 1000 : buyN;
  while (n < want && n < cap){ const c = upgCost(u, L + n); if (buyN === 'max' && cost + c > gold) break; cost += c; n++; }
  return { n, cost };
}
const panel = $('panel');
function renderPanel(){
  if (tab === 'up'){
    panel.innerHTML = `<div class="panel-head"><span>用金幣強化基礎能力</span><div class="seg" id="buyN">
      ${[1,10,'max'].map(v => `<button data-n="${v}" class="${buyN===v?'on':''}">${v==='max'?'MAX':'x'+v}</button>`).join('')}</div></div>` +
      UPG.map(u => `<div class="row-item" data-up="${u.id}">
        <div class="badge" style="background:${u.color}">${u.badge}</div>
        <div class="info"><div class="t1">${u.name}<span class="num lv"></span></div><div class="t2 val"></div></div>
        <button class="buy" data-buy="${u.id}"><span class="k">強化</span><span class="c"><i class="ico gold"></i><b class="cost"></b></span></button>
      </div>`).join('');
  } else if (tab === 'stat'){
    panel.innerHTML = `<div class="panel-head"><span>升級時獲得 3 點能力點</span><span class="px" style="color:var(--exp);font-size:14px">剩餘 <b id="spTxt"></b> 點</span></div>` +
      STATS.map(s => `<div class="row-item" data-st="${s.id}">
        <div class="badge" style="background:${s.color}">${s.badge}</div>
        <div class="info"><div class="t1">${s.name}<span class="num lv"></span></div><div class="t2">每點 ${s.desc}</div></div>
        <div style="display:flex;gap:4px"><button class="buy" data-stat="${s.id}" data-amt="1"><span class="k">+1</span></button><button class="buy" data-stat="${s.id}" data-amt="10"><span class="k">+10</span></button></div>
      </div>`).join('') + `<div class="kv" id="summary"></div>`;
  } else if (tab === 'skill'){
    panel.innerHTML = `<div class="panel-head"><span>技能靠「召喚」取得，重複取得會升級（上限 Lv${SKILL_MAX}）</span></div>` +
      SKILLS.map(sk => { const lv = S.sk[sk.id];
        return `<div class="row-item" style="${lv ? '' : 'opacity:.5'}">
          <div class="badge" style="background:${sk.color}">${sk.el}</div>
          <div class="info"><div class="t1">${sk.name}<span class="num">${lv ? 'Lv ' + lv : '未習得'}</span></div>
          <div class="t2">${sk.desc(lv || 1)}</div></div>
          <div class="px" style="font-size:10px;color:var(--mute);text-align:right">冷卻 ${sk.cd}s<br>MP ${sk.mp}</div>
        </div>`; }).join('');
  } else if (tab === 'gear'){
    const w = WEAPONS[S.eq];
    panel.innerHTML = `<div class="panel-head"><span>點擊已擁有的武器來裝備</span></div>
      <div class="kv"><span>裝備中</span><span style="color:${RARITY[w.r].color};text-align:right;font-weight:700">${w.name} Lv${S.wp[S.eq]}</span>
      <span>裝備效果（攻擊倍率）</span><span class="num">x${D.eqMul.toFixed(2)}</span>
      <span>持有效果（全部武器加總）</span><span class="num">攻擊 +${(D.owned*100).toFixed(1)}%</span></div>
      <div class="grid-w" id="wgrid"></div>`;
    const grid = $('wgrid');
    WEAPONS.forEach(wp => {
      const lv = S.wp[wp.id];
      const cell = document.createElement('button');
      cell.className = 'wcell' + (lv ? '' : ' off') + (S.eq === wp.id ? ' eq' : '');
      cell.style.borderColor = lv ? RARITY[wp.r].color : '';
      cell.dataset.w = wp.id; if (!lv) cell.disabled = true;
      cell.appendChild(weaponIcon(wp.id, 36));
      cell.insertAdjacentHTML('beforeend', `<span class="n" style="color:${RARITY[wp.r].color}">${wp.name}</span><span class="l">${lv ? 'Lv' + lv + (lv >= WEAPON_MAX ? ' MAX' : '') : RARITY[wp.r].name}</span>`);
      grid.appendChild(cell);
    });
  } else if (tab === 'summon'){
    const total = RARITY.reduce((a, r) => a + r.w, 0);
    panel.innerHTML = ['weapon','skill'].map(k => `<div class="sum-box">
        <div class="hd"><b>${k === 'weapon' ? '武器召喚' : '技能召喚'}</b>
        <div class="btns"><button class="buy gem" data-sum="${k}" data-n="1"><span class="k">召喚 1 次</span><span class="c"><i class="ico gem"></i>50</span></button>
        <button class="buy gem" data-sum="${k}" data-n="10"><span class="k">召喚 10 次</span><span class="c"><i class="ico gem"></i>450</span></button></div></div>
        ${k === 'weapon' ? `<div class="rates">${RARITY.map(r => `<span style="color:${r.color}">${r.name} ${(r.w/total*100).toFixed(1)}%</span>`).join('')}</div>`
          : `<div class="note">四種元素技能機率相同，已滿級的技能會轉成 10 鑽石。</div>`}
        <div class="result" data-res="${k}"></div></div>`).join('') +
      `<div class="note">鑽石來源：首次擊敗魔王 +20、每擊殺 50 隻 +5、每次升級 +2。</div>`;
    showSummonResult();
  }
  updatePanel();
}
function updatePanel(){
  if (tab === 'up'){
    panel.querySelectorAll('.row-item').forEach(r => {
      const u = UPG.find(x => x.id === r.dataset.up), L = S.up[u.id];
      const maxed = u.max != null && L >= u.max;
      const { n, cost } = buyCount(u, L, S.gold);
      r.querySelector('.lv').textContent = 'Lv ' + L + (maxed ? ' (MAX)' : '');
      r.querySelector('.val').innerHTML = maxed ? u.fmt(u.val(L)) : `${u.fmt(u.val(L))} → <b>${u.fmt(u.val(L + Math.max(1,n)))}</b>`;
      const b = r.querySelector('.buy');
      b.querySelector('.cost').textContent = maxed ? '—' : fmt(n ? cost : upgCost(u, L));
      b.querySelector('.k').textContent = maxed ? '已滿級' : '強化 +' + Math.max(1, n);
      b.disabled = maxed || n === 0 || cost > S.gold;
    });
    panel.querySelectorAll('#buyN button').forEach(b => b.classList.toggle('on', String(buyN) === b.dataset.n));
  } else if (tab === 'stat'){
    $('spTxt').textContent = S.sp;
    panel.querySelectorAll('.row-item').forEach(r => {
      const st = STATS.find(x => x.id === r.dataset.st);
      r.querySelector('.lv').textContent = S.st[st.id] + (st.max !== Infinity ? ' / ' + st.max : '');
      r.querySelectorAll('.buy').forEach(b => b.disabled = S.sp < 1 || S.st[st.id] >= st.max);
    });
    $('summary').innerHTML = `<span>攻擊力</span><span class="num">${fmt(D.atk)}</span><span>生命值</span><span class="num">${fmt(D.maxHp)}</span>
      <span>攻擊速度</span><span class="num">${D.aspd.toFixed(2)}/秒</span><span>暴擊率 / 暴擊傷害</span><span class="num">${(D.crit*100).toFixed(1)}% / ${Math.round(D.cdmg*100)}%</span>
      <span>金幣加成</span><span class="num">+${Math.round((D.goldMul-1)*100)}%</span>`;
  } else if (tab === 'summon'){
    panel.querySelectorAll('[data-sum]').forEach(b => b.disabled = S.dia < (b.dataset.n === '1' ? 50 : 450));
  }
}
panel.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.n && b.closest('#buyN')){ buyN = b.dataset.n === 'max' ? 'max' : +b.dataset.n; updatePanel(); return; }
  if (b.dataset.buy){
    const u = UPG.find(x => x.id === b.dataset.buy); const { n, cost } = buyCount(u, S.up[u.id], S.gold);
    if (n && cost <= S.gold){ S.gold -= cost; S.up[u.id] += n; const before = D.maxHp; derive(); if (u.id === 'hp') G.hero.hp += D.maxHp - before; updatePanel(); }
  } else if (b.dataset.stat){
    const st = STATS.find(x => x.id === b.dataset.stat); const amt = Math.min(+b.dataset.amt, S.sp, st.max - S.st[st.id]);
    if (amt > 0){ S.sp -= amt; S.st[st.id] += amt; const before = D.maxHp; derive(); if (st.id === 'vit') G.hero.hp += D.maxHp - before; updatePanel(); }
  } else if (b.dataset.w != null){
    S.eq = +b.dataset.w; derive(); renderPanel();
  } else if (b.dataset.sum){
    summon(b.dataset.sum, +b.dataset.n);
  }
});
function summon(kind, n){
  const cost = n === 1 ? 50 : 450; if (S.dia < cost) return;
  S.dia -= cost; const items = [];
  for (let i=0;i<n;i++){
    if (kind === 'weapon'){
      const total = RARITY.reduce((a, r) => a + r.w, 0); let roll = Math.random()*total, r = 0;
      while (roll >= RARITY[r].w && r < RARITY.length-1){ roll -= RARITY[r].w; r++; }
      const wp = WEAPONS[r*2 + (Math.random() < 0.5 ? 0 : 1)];
      S.wp[wp.id] = Math.min(WEAPON_MAX, (S.wp[wp.id] || 0) + 1);
      items.push({ name:wp.name, color:RARITY[r].color });
      // 自動換上更強的武器
      if (wp.mul * (1 + 0.15*(S.wp[wp.id]-1)) > WEAPONS[S.eq].mul * (1 + 0.15*(S.wp[S.eq]-1))) S.eq = wp.id;
    } else {
      const sk = SKILLS[Math.floor(Math.random()*SKILLS.length)];
      if ((S.sk[sk.id] || 0) >= SKILL_MAX){ S.dia += 10; items.push({ name:sk.name + ' → 10鑽', color:'#958eab' }); }
      else { S.sk[sk.id] = (S.sk[sk.id] || 0) + 1; items.push({ name:`${sk.name} Lv${S.sk[sk.id]}`, color:sk.color }); }
    }
  }
  lastSummon = { kind, items }; derive(); showSummonResult(); updatePanel(); updateSkillBar(); save();
}
function showSummonResult(){
  panel.querySelectorAll('[data-res]').forEach(el => {
    el.innerHTML = el.dataset.res === lastSummon.kind ? lastSummon.items.map((it, i) =>
      `<div class="it" style="border-color:${it.color};color:${it.color};animation-delay:${i*40}ms">${it.name}</div>`).join('') : '';
  });
}

let lastHud = 0;
function updateHud(){
  const h = G.hero;
  $('goldTxt').textContent = fmt(S.gold); $('gemTxt').textContent = fmt(S.dia);
  $('stageLbl').textContent = 'STAGE ' + S.stage; $('worldName').textContent = WORLDS[worldIdx(S.stage)].name;
  $('lvTxt').textContent = S.lv;
  $('hpBar').style.width = (h.hp / D.maxHp * 100) + '%'; $('hpTxt').textContent = fmt(h.hp) + '/' + fmt(D.maxHp);
  $('mpBar').style.width = (h.mp / D.maxMp * 100) + '%'; $('mpTxt').textContent = Math.floor(h.mp) + '/' + D.maxMp;
  const xp = S.exp / expNeed(S.lv) * 100; $('xpBar').style.width = xp + '%'; $('xpTxt').textContent = 'EXP ' + xp.toFixed(1) + '%';
  const boss = G.mode === 'boss';
  $('farmRow').hidden = boss; $('bossRow').hidden = !boss;
  $('killLbl').textContent = `擊殺 ${S.kills}/${KILLS_PER_STAGE}`; $('killBar').style.width = (S.kills / KILLS_PER_STAGE * 100) + '%';
  $('bossBtn').hidden = boss || S.autoBoss || S.kills < KILLS_PER_STAGE;
  if (boss){ const b = G.enemies.find(e => e.boss); $('bossBar').style.width = (b ? b.hp / b.max * 100 : 0) + '%';
    $('bossTimer').textContent = Math.max(0, G.bossT).toFixed(1); $('bossLbl').textContent = `魔王 · ${S.stage}`; }
  updateSkillBar();
}
function refreshAll(){ derive(); renderPanel(); updateHud(); }

// ============================================================ 離線收益
function offlineReward(){
  const secs = Math.min(MAX_OFFLINE, (Date.now() - (S.last || Date.now())) / 1000);
  if (secs < 60) return;
  const kills = secs * 0.45;
  const gold = kills * monGold(S.stage) * D.goldMul, exp = kills * monExp(S.stage);
  S.gold += gold; gainExp(exp);
  const hh = Math.floor(secs/3600), mm = Math.floor(secs%3600/60);
  $('modalBox').innerHTML = `<h3>離線狩獵報告</h3><div class="note">你離開了 ${hh ? hh + ' 小時 ' : ''}${mm} 分鐘，獵魔者持續在 STAGE ${S.stage} 狩獵。</div>
    <div class="kv"><span>擊殺</span><span class="num">${fmt(kills)}</span><span>金幣</span><span class="num" style="color:var(--gold)">+${fmt(gold)}</span><span>經驗</span><span class="num" style="color:var(--exp)">+${fmt(exp)}</span></div>
    <button class="buy" id="modalOk"><span class="k">收下</span></button>`;
  $('modal').hidden = false;
  $('modalOk').onclick = () => { $('modal').hidden = true; refreshAll(); };
}

// ============================================================ 啟動
let prev = 0, saveT = 0;
function frame(t){
  const real = Math.min(0.05, (t - prev) / 1000 || 0); prev = t;
  const dt = real * S.speed;
  // 高倍速時拆成小步，避免穿透
  const steps = Math.ceil(dt / 0.02); for (let i=0;i<steps;i++) update(dt/steps);
  draw();
  if (t - lastHud > 120){ lastHud = t; updateHud(); if (tab === 'up' || tab === 'summon' || tab === 'stat') updatePanel(); }
  if ((saveT += real) > 5){ saveT = 0; save(); }
  requestAnimationFrame(frame);
}
function start(data){
  const had = load(data);
  buildSprites(); buildSkillBar(); derive();
  G.hero.hp = D.maxHp; G.hero.mp = D.maxMp;
  $('speedBtn').textContent = 'x' + S.speed;
  refreshAll();
  if (had && !(data && data.S)) offlineReward();
  window.claude?.hot?.snapshot?.(() => ({ S }));
  requestAnimationFrame(t => { prev = t; requestAnimationFrame(frame); });
  addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  window.__slayer = { S, G, D, derive };
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
